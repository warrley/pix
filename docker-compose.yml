services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: urubudopix
      POSTGRES_PASSWORD: pix12345
    ports:
      - "5433:5432"

  backend:
    build: ./backend
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -p 3000 -b '0.0.0.0'"
    volumes:
      - ./backend:/rails
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://urubudopix:pix12345@db:5432/backend_development
    depends_on:
      - db

volumes:
  postgres_data:
