services:
  db:
    image: postgres:15
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-backend_development}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-backend_development}
    ports:
      - "${DB_PORT_BINDING:-5433:5432}"

  backend:
    build: ./backend
    entrypoint: []
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails db:prepare && bundle exec rails s -p 3000 -b '0.0.0.0'"
    volumes:
      - ./backend:/rails
    ports:
      - "${BACKEND_PORT_BINDING:-3000:3000}"
    environment:
      RAILS_ENV: ${RAILS_ENV:-development}
      DB_HOST: ${DB_HOST:-db}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-backend_development}
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-backend_development}}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-pix.warley.xyz,localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      NOTIFICATIONS_WEBHOOK_URL: ${NOTIFICATIONS_WEBHOOK_URL:-}
      NOTIFICATIONS_WEBHOOK_ALLOWED_HOSTS: ${NOTIFICATIONS_WEBHOOK_ALLOWED_HOSTS:-}
      NOTIFICATIONS_WEBHOOK_SECRET: ${NOTIFICATIONS_WEBHOOK_SECRET:-}
      PGSSLROOTCERT: ${PGSSLROOTCERT:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
