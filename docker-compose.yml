services:
  db:
    image: postgres:15
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-backend_development}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-backend_development}
    ports:
      - "${DB_PORT_BINDING:-5433:5432}"

  backend:
    build:
      context: ./backend
      args:
        BUNDLE_WITHOUT: ""
    restart: unless-stopped
    entrypoint: []
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails db:prepare && bundle exec rails s -p 3000 -b '0.0.0.0'"
    volumes:
      - ./backend:/rails
    ports:
      - "${BACKEND_PORT_BINDING:-3000:3000}"
    environment:
      RAILS_ENV: ${RAILS_ENV:-development}
      BUNDLE_PATH: /usr/local/bundle
      BUNDLE_WITHOUT: ""
      DB_HOST: ${DB_HOST:-db}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-backend_development}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-pix.warley.xyz,localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      NOTIFICATIONS_WEBHOOK_URL: ${NOTIFICATIONS_WEBHOOK_URL:-}
      NOTIFICATIONS_WEBHOOK_ALLOWED_HOSTS: ${NOTIFICATIONS_WEBHOOK_ALLOWED_HOSTS:-}
      NOTIFICATIONS_WEBHOOK_SECRET: ${NOTIFICATIONS_WEBHOOK_SECRET:-}
      PGSSLROOTCERT: ${PGSSLROOTCERT:-}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN}
    depends_on:
      db:
        condition: service_healthy

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-backend_development}?sslmode=disable"
    ports:
      - "${POSTGRES_EXPORTER_PORT_BINDING:-127.0.0.1:9187:9187}"
    depends_on:
      db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf '%s' "$${METRICS_BEARER_TOKEN}" > /tmp/metrics_token &&
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --web.enable-lifecycle
    environment:
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN}
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT_BINDING:-127.0.0.1:9090:9090}"
    depends_on:
      - backend
      - postgres-exporter

  grafana:
    image: grafana/grafana:latest
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$GF_SECURITY_ADMIN_USER" ] || [ -z "$$GF_SECURITY_ADMIN_PASSWORD" ]; then
          echo "ERROR: GRAFANA_ADMIN_USER and GRAFANA_ADMIN_PASSWORD must be set in .env" >&2
          exit 1
        fi
        exec /run.sh
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT_BINDING:-127.0.0.1:3001:3000}"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
