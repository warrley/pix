name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }};
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------
  # Backend CI: Ruby on Rails
  # ------------------------------------------------------------
  backend:
    name: Backend (Rails)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: backend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DB_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: backend

      - name: Check code style (RuboCop)
        run: bin/rubocop

      - name: Security audit (bundler-audit)
        run: bin/bundler-audit

      - name: Security scan (Brakeman)
        run: bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error --except EOLRuby

      - name: Set up database
        run: bin/rails db:prepare

      - name: Run Rails tests
        run: bin/rails test

      - name: Verify seeds
        run: bin/rails db:seed:replant

